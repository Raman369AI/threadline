name: online repository validation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  public-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Validate pinned public repositories
        run: python tests/online_repo_smoke.py --report artifacts/online-validation.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: threadline-online-validation
          path: artifacts/online-validation.json
          if-no-files-found: warn
