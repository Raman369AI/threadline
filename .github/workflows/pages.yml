name: GitHub Pages review generator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'threadline/**'
      - 'scripts/build_pages.py'
      - 'tests/pages*'
      - 'pyproject.toml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install '.[browser-test]'
      - run: npm ci --prefix tests/browser-tools --ignore-scripts --no-audit --no-fund
      - run: python -m unittest discover
      - run: node --test tests/pages.test.mjs
      - uses: actions/cache@v4
        with:
          path: build/pyodide-cache
          key: pyodide-pages-${{ hashFiles('scripts/build_pages.py') }}
      - run: python scripts/build_pages.py
      - run: python tests/pages_browser.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
