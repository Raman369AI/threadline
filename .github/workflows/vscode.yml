name: VS Code extension
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci --prefix vscode --ignore-scripts --no-audit --no-fund
      - run: python -m unittest test_vscode_bridge -v
      - run: xvfb-run -a npm test --prefix vscode
      - run: npm run package --prefix vscode
      - uses: actions/upload-artifact@v6
        with:
          name: threadline-vscode
          path: vscode/dist/*.vsix
