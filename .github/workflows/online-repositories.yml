name: online repository validation

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  public-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: npm ci --prefix tests/browser-tools --ignore-scripts --no-audit --no-fund
      - name: Validate pinned public repositories
        run: python tests/online_repo_smoke.py --report artifacts/online-validation.json
      - name: Cross-check call targets with pyright
        run: python tests/pyright_crosscheck.py --repo flask --repo requests --report artifacts/pyright-crosscheck-public.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: threadline-online-validation
          path: |
            artifacts/online-validation.json
            artifacts/pyright-crosscheck-public.json
          if-no-files-found: warn
